<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Rolo 35, plataforma de ingressos de cinema">
  <defs>
    <linearGradient id="chama" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#E32B21"/>
      <stop offset="52%" stop-color="#F26522"/>
      <stop offset="100%" stop-color="#FFC414"/>
    </linearGradient>
    <pattern id="scanline" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#F4E9D4" opacity="0.05"/>
    </pattern>
    <pattern id="perfuracao" width="46" height="34" patternUnits="userSpaceOnUse">
      <rect x="10" y="9" width="26" height="17" rx="4" fill="#0C0910"/>
    </pattern>
    <radialGradient id="tubo" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0%" stop-color="#241A28"/>
      <stop offset="100%" stop-color="#0C0910"/>
    </radialGradient>
  </defs>

  <!-- corpo da "tela" -->
  <rect width="1200" height="340" fill="#0C0910"/>
  <rect x="0" y="34" width="1200" height="272" fill="url(#tubo)"/>

  <!-- fita: perfuração de película em cima e embaixo -->
  <rect x="0" y="0" width="1200" height="34" fill="#171219"/>
  <rect x="0" y="0" width="1200" height="34" fill="url(#perfuracao)"/>
  <rect x="0" y="306" width="1200" height="34" fill="#171219"/>
  <rect x="0" y="306" width="1200" height="34" fill="url(#perfuracao)"/>

  <!-- marca -->
  <g transform="translate(84, 118)">
    <circle cx="34" cy="34" r="32" fill="none" stroke="#FFC414" stroke-width="3"/>
    <text x="34" y="45" text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="27" fill="#FFC414">35</text>
  </g>

  <g font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="86" letter-spacing="2">
    <text x="196" y="185" fill="#7A0F0A">ROLO 35</text>
    <text x="191" y="180" fill="url(#chama)">ROLO 35</text>
  </g>

  <!-- legenda tipo terminal -->
  <g font-family="'Courier New', Courier, monospace" font-size="19" letter-spacing="1.2">
    <text x="196" y="223" fill="#F4E9D4" opacity="0.72">PLATAFORMA DE INGRESSOS &#183; CINEMA DE RUA, TV DE TUBO, VHS</text>
    <text x="196" y="253" fill="#7ED9F2" opacity="0.9">&#9654; FILME &#8594; SESS&#195;O &#8594; ASSENTO &#8594; PAGAMENTO &#8594; INGRESSO &#8594; PORTARIA</text>
  </g>

  <!-- marcação de gravação, canto direito -->
  <g transform="translate(1012, 70)" font-family="'Courier New', Courier, monospace" font-size="19">
    <circle cx="0" cy="-6" r="7" fill="#E32B21"/>
    <text x="16" y="0" fill="#F4E9D4" opacity="0.75">REC</text>
    <text x="-2" y="30" fill="#F4E9D4" opacity="0.4">SP  35mm</text>
  </g>

  <!-- barra de cor da chama -->
  <rect x="0" y="296" width="1200" height="10" fill="url(#chama)"/>

  <!-- textura de scanline por cima de tudo -->
  <rect x="0" y="34" width="1200" height="272" fill="url(#scanline)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" fill="none" stroke="#F4E9D4" opacity="0.16" stroke-width="3"/>
</svg>
