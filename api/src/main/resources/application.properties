spring.application.name=api

### Datasource ###
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rolo35}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rolo35}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rolo35}

### JPA ###
spring.jpa.hibernate.ddl-auto=validate

### Actuator ###
management.endpoints.web.exposure.include=health

### JWT ###
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=480

### Ticket HMAC ###
ticket.hmac.secret=${TICKET_HMAC_SECRET}

### CORS ###
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

### TMDb ###
tmdb.api.token=${TMDB_API_TOKEN}

### HTTP client (RestClient) ###
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=8s
