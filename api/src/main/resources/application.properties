spring.application.name=api

### Servidor ###
# O Render injeta PORT (10000 por padrão) e espera o serviço escutar nela; ele até tenta detectar
# outra porta, mas quando a detecção falha o deploy inteiro falha. O default 8080 mantém o compose e
# o dev local inalterados, já que fora do Render PORT não existe.
server.port=${PORT:8080}

### Datasource ###
# SPRING_DATASOURCE_URL continua sendo o caminho normal (compose e dev local). O fallback monta a
# URL a partir de host/porta/nome separados porque é assim que o Render expõe o banco gerenciado:
# a connectionString pronta dele vem como postgres://..., formato que o driver JDBC não aceita.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rolo35}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rolo35}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rolo35}

### JPA ###
spring.jpa.hibernate.ddl-auto=validate

### Actuator ###
management.endpoints.web.exposure.include=health

### JWT ###
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=480

### Ticket HMAC ###
ticket.hmac.secret=${TICKET_HMAC_SECRET}

### CORS ###
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

### Limite de cadastro ###
# Teto por endereço de origem em POST /api/auth/cadastro. Folgado o bastante pra não atrapalhar quem
# avalia o sistema criando uma conta de cada papel, apertado o bastante pra encarecer mineração de
# contas — que, sem isto, custa zero. Ver LimitadorDeCadastro pro que este limite não resolve.
cadastro.limite.tentativas=${CADASTRO_LIMITE_TENTATIVAS:5}
cadastro.limite.janela-minutos=${CADASTRO_LIMITE_JANELA_MINUTOS:60}

### TMDb ###
tmdb.api.token=${TMDB_API_TOKEN}

### HTTP client (RestClient) ###
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=8s

### Janela do turno da portaria ###
# Quanto antes do horário da sessão (minutos) e quanto depois (horas) a portaria pode ativá-la como
# sessão do turno. O default é a regra de operação: 30min antes, 2h depois. Ativar a sessão errada
# faz a fila inteira ser recusada com ingresso legítimo na mão, então a janela existe por segurança
# operacional, não por capricho.
#
# Alargue PORTARIA_JANELA_ANTES_MINUTOS pra exercitar o fluxo da portaria fora do horário de uma
# sessão real: todo seed nasce com data futura (dias à frente), então com o default nenhuma sessão
# semeada é selecionável. 20160 = 14 dias, que cobre tudo que o seed cria.
portaria.turno.janela-antes-minutos=${PORTARIA_JANELA_ANTES_MINUTOS:30}
portaria.turno.janela-depois-horas=${PORTARIA_JANELA_DEPOIS_HORAS:2}
