server {
    listen 80;
    # A imagem base do compose é IPv4-only sem esta linha; num host que resolve localhost pra ::1
    # primeiro, a porta publicada responde e o servidor não.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx:alpine vem com gzip off. O bundle de uma SPA é o arquivo mais pesado que esta porta
    # serve, e sai inteiro sem compressão enquanto isto estiver desligado.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # A SPA não é embutida em lugar nenhum e não usa o Referer pra nada, então os três são de graça
    # aqui e fecham clickjacking e sniffing de tipo por conteúdo.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # As rotas do react-router não existem como arquivo no disco. Sem este fallback, dar F5 em
    # /organizador ou abrir um link de ingresso direto devolve o 404 do nginx em vez da aplicação.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O bundle vem com hash no nome (padrão do Vite), então pode ser cacheado pra sempre; o
    # index.html não pode, senão o navegador continua pedindo o bundle da versão anterior.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
