server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # As rotas do react-router não existem como arquivo no disco. Sem este fallback, dar F5 em
    # /organizador ou abrir um link de ingresso direto devolve o 404 do nginx em vez da aplicação.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O bundle vem com hash no nome (padrão do Vite), então pode ser cacheado pra sempre; o
    # index.html não pode, senão o navegador continua pedindo o bundle da versão anterior.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
