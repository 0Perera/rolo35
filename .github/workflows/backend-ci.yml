name: testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Dar permissão de execução ao Maven
        run: chmod +x mvnw

      - name: Rodar os testes
        run: ./mvnw test